<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HealthSphere - Enterprise Hospital Management System</title>
    <style>
/* Full-width HealthSphere Hospital Engine Override */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100vh;
  background-color: #f8fafc !important;
  color: #1e293b;
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
}

#root {
  width: 100% !important;
  max-width: 100% !important;
  margin: 0 !important;
  padding: 0 !important;
  min-height: 100vh !important;
  text-align: left !important;
  border-inline: none !important;
  display: flex !important;
  flex-direction: column !important;
}

/* HealthQueue AI Theme & CSS resets */
:root {
  --primary-color: #0284c7;
  --primary-dark: #0369a1;
  --primary-light: #e0f2fe;
  --secondary-color: #0d9488;
  --secondary-dark: #115e59;
  --secondary-light: #ccfbf1;
  
  --bg-main: #f8fafc;
  --bg-card: #ffffff;
  --bg-sidebar: #0f172a;
  
  --text-main: #1e293b;
  --text-muted: #64748b;
  --text-inverse: #ffffff;
  
  --border-color: #e2e8f0;
  
  /* Status Colors */
  --color-scheduled: #0284c7;
  --bg-scheduled: #e0f2fe;
  
  --color-confirmed: #4f46e5;
  --bg-confirmed: #e0e7ff;
  
  --color-arrived: #d97706;
  --bg-arrived: #fef3c7;
  
  --color-inqueue: #8b5cf6;
  --bg-inqueue: #ede9fe;
  
  --color-inprogress: #0d9488;
  --bg-inprogress: #ccfbf1;
  
  --color-completed: #16a34a;
  --bg-completed: #dcfce7;
  
  --color-cancelled: #dc2626;
  --bg-cancelled: #fee2e2;
  
  --color-noshow: #4b5563;
  --bg-noshow: #f3f4f6;
  
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
  
  --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-sans);
  background-color: var(--bg-main);
  color: var(--text-main);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* Auth Layout */
.auth-container {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 1.5rem;
  background-color: #f1f5f9;
}

.auth-card {
  width: 100%;
  max-width: 440px;
  background: var(--bg-card);
  padding: 2.5rem;
  border-radius: 12px;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--border-color);
}

.auth-header {
  text-align: center;
  margin-bottom: 2rem;
}

.auth-header h1 {
  font-size: 1.75rem;
  color: var(--primary-dark);
  font-weight: 700;
}

.auth-header p {
  color: var(--text-muted);
  margin-top: 0.5rem;
  font-size: 0.875rem;
}

/* Dashboard Layout */
.app-layout {
  display: flex;
  min-height: 100vh;
}

/* Sidebar styling */
.sidebar {
  width: 260px;
  background-color: var(--bg-sidebar);
  color: var(--text-inverse);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  box-shadow: var(--shadow-lg);
  transition: transform 0.3s ease;
}

.sidebar-header {
  padding: 1.5rem;
  font-size: 1.25rem;
  font-weight: 700;
  border-bottom: 1px solid #1e293b;
  color: var(--primary-light);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.sidebar-menu {
  flex: 1;
  padding: 1.5rem 0.75rem;
  list-style: none;
  overflow-y: auto;
}

.sidebar-item {
  margin-bottom: 0.25rem;
}

.sidebar-link {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.75rem 1rem;
  color: #94a3b8;
  text-decoration: none;
  border-radius: 8px;
  font-weight: 500;
  font-size: 0.95rem;
  transition: all 0.2s;
}

.sidebar-link:hover {
  background-color: #1e293b;
  color: var(--text-inverse);
}

.sidebar-link.active {
  background-color: var(--primary-color);
  color: var(--text-inverse);
}

.sidebar-footer {
  padding: 1.5rem;
  border-top: 1px solid #1e293b;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.user-info-brief {
  display: flex;
  flex-direction: column;
}

.user-info-name {
  font-weight: 600;
  font-size: 0.9rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 150px;
}

.user-info-role {
  font-size: 0.75rem;
  color: #64748b;
  text-transform: uppercase;
  font-weight: 700;
}

/* Main Workspace Content */
.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0; /* Prevents flex children from stretching */
  overflow: hidden;
}

.navbar {
  height: 64px;
  background-color: var(--bg-card);
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 2rem;
  flex-shrink: 0;
}

.navbar-brand {
  font-weight: 700;
  color: var(--primary-color);
  font-size: 1.15rem;
}

.navbar-actions {
  display: flex;
  align-items: center;
  gap: 1.5rem;
}

.page-wrapper {
  flex: 1;
  padding: 2rem;
  overflow-y: auto;
  background-color: var(--bg-main);
}

.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 2rem;
}

.page-title h2 {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--text-main);
}

.page-title p {
  color: var(--text-muted);
  font-size: 0.875rem;
  margin-top: 0.25rem;
}

/* Form Styles */
.form-group {
  margin-bottom: 1.25rem;
}

.form-group label {
  display: block;
  font-size: 0.875rem;
  font-weight: 600;
  color: #334155;
  margin-bottom: 0.375rem;
}

.form-control {
  width: 100%;
  padding: 0.625rem 0.875rem;
  font-size: 0.95rem;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  outline: none;
  font-family: inherit;
  transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
}

.form-control:focus {
  border-color: var(--primary-color);
  box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}

/* Button Styles */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.625rem 1.25rem;
  font-size: 0.95rem;
  font-weight: 600;
  border-radius: 6px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: background-color 0.15s, border-color 0.15s;
  font-family: inherit;
}

.btn-primary {
  background-color: var(--primary-color);
  color: var(--text-inverse);
}

.btn-primary:hover {
  background-color: var(--primary-dark);
}

.btn-secondary {
  background-color: var(--secondary-color);
  color: var(--text-inverse);
}

.btn-secondary:hover {
  background-color: var(--secondary-dark);
}

.btn-outline {
  background-color: transparent;
  border-color: var(--border-color);
  color: var(--text-main);
}

.btn-outline:hover {
  background-color: #f1f5f9;
}

.btn-danger {
  background-color: var(--color-cancelled);
  color: var(--text-inverse);
}

.btn-danger:hover {
  background-color: #b91c1c;
}

.btn-block {
  width: 100%;
}

.btn-sm {
  padding: 0.375rem 0.75rem;
  font-size: 0.85rem;
}

/* Grid Cards Layout */
.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 1.5rem;
  margin-bottom: 2rem;
}

.card-summary {
  background: var(--bg-card);
  padding: 1.5rem;
  border-radius: 8px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.card-summary-info h3 {
  font-size: 0.875rem;
  text-transform: uppercase;
  color: var(--text-muted);
  font-weight: 700;
  letter-spacing: 0.05em;
}

.card-summary-info p {
  font-size: 2rem;
  font-weight: 700;
  color: var(--text-main);
  margin-top: 0.25rem;
}

.card-summary-icon {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: var(--primary-light);
  color: var(--primary-color);
}

/* Tables & Lists */
.data-table-container {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  margin-bottom: 1.5rem;
}

.table-header {
  padding: 1.25rem 1.5rem;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.table-header h3 {
  font-size: 1.1rem;
  font-weight: 700;
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
}

.data-table th {
  background-color: #f8fafc;
  padding: 0.75rem 1.5rem;
  font-size: 0.85rem;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border-color);
}

.data-table td {
  padding: 1rem 1.5rem;
  border-bottom: 1px solid var(--border-color);
  font-size: 0.925rem;
}

.data-table tr:last-child td {
  border-bottom: none;
}

.data-table tr:hover td {
  background-color: #f8fafc;
}

/* Status Badges */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 0.25rem 0.625rem;
  font-size: 0.775rem;
  font-weight: 700;
  border-radius: 9999px;
  text-transform: uppercase;
}

.badge-scheduled { color: var(--color-scheduled); background: var(--bg-scheduled); }
.badge-confirmed { color: var(--color-confirmed); background: var(--bg-confirmed); }
.badge-arrived { color: var(--color-arrived); background: var(--bg-arrived); }
.badge-in_queue { color: var(--color-inqueue); background: var(--bg-inqueue); }
.badge-in_progress { color: var(--color-inprogress); background: var(--bg-inprogress); }
.badge-completed { color: var(--color-completed); background: var(--bg-completed); }
.badge-cancelled { color: var(--color-cancelled); background: var(--bg-cancelled); }
.badge-no_show { color: var(--color-noshow); background: var(--bg-noshow); }
.badge-rescheduled { color: var(--color-confirmed); background: var(--bg-confirmed); }

.badge-waiting { color: var(--color-scheduled); background: var(--bg-scheduled); }
.badge-called { color: var(--color-inqueue); background: var(--bg-inqueue); }
.badge-skipped { color: var(--color-noshow); background: var(--bg-noshow); }

/* Slots selectors */
.slots-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 0.75rem;
  margin-top: 1rem;
}

.slot-item {
  padding: 0.625rem;
  text-align: center;
  border-radius: 6px;
  border: 1px solid var(--border-color);
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.slot-item.available {
  background-color: #ffffff;
  color: var(--text-main);
}

.slot-item.available:hover {
  border-color: var(--primary-color);
  background-color: var(--primary-light);
  color: var(--primary-dark);
}

.slot-item.selected {
  background-color: var(--primary-color) !important;
  color: var(--text-inverse) !important;
  border-color: var(--primary-dark) !important;
}

.slot-item.unavailable {
  background-color: #f1f5f9;
  color: #94a3b8;
  cursor: not-allowed;
  border-style: dashed;
}

/* Modals */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(15, 23, 42, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 1rem;
}

.modal-content {
  background: var(--bg-card);
  border-radius: 10px;
  max-width: 500px;
  width: 100%;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
}

.modal-header {
  padding: 1.25rem 1.5rem;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-header h3 {
  font-size: 1.15rem;
  font-weight: 700;
}

.modal-close {
  background: transparent;
  border: none;
  cursor: pointer;
  font-size: 1.25rem;
  color: var(--text-muted);
}

.modal-body {
  padding: 1.5rem;
}

.modal-footer {
  padding: 1.25rem 1.5rem;
  border-top: 1px solid var(--border-color);
  display: flex;
  justify-content: flex-end;
  gap: 0.75rem;
  background-color: #f8fafc;
}

/* Disclaimers & Alerts */
.disclaimer-bar {
  background-color: #fef2f2;
  border: 1px solid #fecaca;
  color: #991b1b;
  padding: 0.75rem 1rem;
  border-radius: 6px;
  font-size: 0.85rem;
  margin-top: 2rem;
  text-align: center;
  font-weight: 500;
}

/* Notification Popups */
.notifications-panel {
  width: 320px;
  max-height: 400px;
  overflow-y: auto;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  box-shadow: var(--shadow-lg);
  position: absolute;
  right: 2rem;
  top: 60px;
  z-index: 100;
}

.notification-header {
  padding: 0.75rem 1rem;
  border-bottom: 1px solid var(--border-color);
  font-weight: 700;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.notification-item {
  padding: 0.85rem 1rem;
  border-bottom: 1px solid var(--border-color);
  font-size: 0.875rem;
  cursor: pointer;
  transition: background-color 0.15s;
}

.notification-item:hover {
  background-color: #f8fafc;
}

.notification-item.unread {
  background-color: var(--primary-light);
  border-left: 3px solid var(--primary-color);
}

.notification-title {
  font-weight: 600;
  color: var(--text-main);
}

.notification-msg {
  color: var(--text-muted);
  margin-top: 0.25rem;
}

.notification-time {
  font-size: 0.75rem;
  color: #94a3b8;
  margin-top: 0.35rem;
}

/* Loading & Empty States */
.loading-spinner {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 3rem;
}

.spinner {
  width: 40px;
  height: 40px;
  border: 4px solid var(--border-color);
  border-top-color: var(--primary-color);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.empty-state {
  text-align: center;
  padding: 4rem 2rem;
  color: var(--text-muted);
}

.empty-state-icon {
  margin-bottom: 1rem;
  color: #cbd5e1;
}

/* Search bar styling */
.search-filter-panel {
  display: flex;
  gap: 1rem;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
}

.search-input-wrapper {
  flex: 1;
  min-width: 260px;
}

.filter-wrapper {
  width: 200px;
}

/* Responsive sidebars for tablets and mobiles */
@media (max-width: 768px) {
  .app-layout {
    flex-direction: column;
  }
  .sidebar {
    width: 100%;
    height: auto;
  }
  .sidebar-menu {
    display: flex;
    flex-wrap: wrap;
    padding: 0.75rem;
  }
  .sidebar-item {
    margin-right: 0.5rem;
    margin-bottom: 0.5rem;
  }
}

    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
